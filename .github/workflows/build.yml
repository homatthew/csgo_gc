name: Build Windows

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out pinned source and dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure Windows x86 Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\release" | Out-Null
          cmake -A Win32 `
            -B "$env:GITHUB_WORKSPACE\build" `
            -S "$env:GITHUB_WORKSPACE" `
            -DOUTDIR="$env:GITHUB_WORKSPACE\release" `
            -DCRYPTOPP_DISABLE_ASM=ON

      - name: Build Windows x86 Release
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE\build" `
            --config Release `
            --target csgo srcds csgo_gc

      - name: Package audited inputs
        shell: pwsh
        run: |
          $release = "$env:GITHUB_WORKSPACE\release"
          $licenses = Join-Path $release "licenses"
          $gc = Join-Path $release "csgo_gc"
          New-Item -ItemType Directory -Force -Path $licenses, $gc | Out-Null

          Copy-Item "$env:GITHUB_WORKSPACE\README.md" $release
          Copy-Item "$env:GITHUB_WORKSPACE\LICENSE" "$licenses\LICENSE-csgo_gc.txt"
          Copy-Item "$env:GITHUB_WORKSPACE\vendor\cryptopp\License.txt" "$licenses\LICENSE-crypto++.txt"
          Copy-Item "$env:GITHUB_WORKSPACE\vendor\cryptopp-cmake\LICENSE" "$licenses\LICENSE-cryptopp-cmake.txt"
          Copy-Item "$env:GITHUB_WORKSPACE\vendor\distorm\COPYING" "$licenses\LICENSE-distorm.txt"
          Copy-Item "$env:GITHUB_WORKSPACE\vendor\funchook\LICENSE" "$licenses\LICENSE-funchook.txt"
          Copy-Item "$env:GITHUB_WORKSPACE\build\_deps\protobuf-src\LICENSE" "$licenses\LICENSE-protobuf.txt"

          Copy-Item "$env:GITHUB_WORKSPACE\examples\config.txt" $gc
          Copy-Item "$env:GITHUB_WORKSPACE\examples\inventory.txt" $gc
          Copy-Item "$env:GITHUB_WORKSPACE\examples\price_sheet.txt" $gc
          Copy-Item "$env:GITHUB_WORKSPACE\examples\unusual_loot_lists.txt" $gc
          Copy-Item "$env:GITHUB_WORKSPACE\DEPENDENCIES.lock.md" $release

      - name: Create ZIP and checksums
        shell: pwsh
        run: |
          $zip = "$env:GITHUB_WORKSPACE\csgo_gc-windows.zip"
          Compress-Archive `
            -Path "$env:GITHUB_WORKSPACE\release\*" `
            -DestinationPath $zip `
            -Force

          $lines = Get-ChildItem "$env:GITHUB_WORKSPACE\release" -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $relative = $_.FullName.Substring("$env:GITHUB_WORKSPACE\release".Length + 1)
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash
              "$hash  $relative"
            }
          $lines | Set-Content -Encoding ascii "$env:GITHUB_WORKSPACE\SHA256SUMS.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: csgo_gc-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/csgo_gc-windows.zip
            ${{ github.workspace }}/SHA256SUMS.txt

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: csgo_gc-windows-${{ github.sha }}
          path: release-artifacts

      - name: Create immutable tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --notes "Built from $SHA with dependencies pinned in DEPENDENCIES.lock.md." \
            release-artifacts/csgo_gc-windows.zip \
            release-artifacts/SHA256SUMS.txt
